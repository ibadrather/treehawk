# Dependency policy, enforced in CI by cargo-deny
# (https://github.com/EmbarkStudios/cargo-deny), following the practice of
# uv (https://github.com/astral-sh/uv). Checks security advisories, license
# compatibility, and dependency sources.
#
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisories: any vulnerability in the dependency tree fails CI.
yanked = "warn"
ignore = [
  # `paste` is archived/unmaintained, pulled in transitively by parquet.
  # No replacement upstream; remove once parquet drops the dependency.
  { id = "RUSTSEC-2024-0436", reason = "transitive via parquet, no upgrade available" },
]

[licenses]
# treehawk is MIT OR Apache-2.0; allow the common permissive licenses.
# If CI flags a new dependency's license, either add it here (if permissive)
# or pick a different crate.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
# Duplicate versions of the same crate bloat the binary; surface them but
# don't block (the arrow/parquet stack makes full dedup impractical).
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
