[package]
name = "treehawk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Run any command and log CPU, RAM & GPU usage of it and all its children"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ibad-rather/treehawk"
readme = "README.md"
keywords = ["monitoring", "profiling", "cgroup", "observability", "cli"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
anyhow = "1"
arrow = { version = "59", default-features = false, features = ["ipc"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
libc = "0.2"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
rustix = { version = "1.1", features = ["fs", "process", "system", "thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.clippy]
unwrap_used = "warn"
