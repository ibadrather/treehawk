name: CI

# Lint, type check and test on every push to any branch and on every pull
# request - but only when something that can change the result changed: the
# source, the tests, the tooling config or this workflow. A docs or diagram
# change alone skips it. The Release workflow calls this too, so nothing ships
# without it.

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-lint

      - name: Install
        run: uv sync --locked

      - name: Formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check --output-format=github

  typecheck:
    name: Type check (mypy, Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # platforms/darwin binds no library at import, so mypy checks it on
          # Linux too - these two are here to catch a typeshed difference, not
          # to be the only place the macOS code is seen.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Without a per-job suffix, typecheck and test on the same Python
          # compute the same cache key and race to save it. The workflow name
          # keeps a Release-triggered run apart from the push-triggered one,
          # and the runner keeps Linux and macOS apart.
          cache-suffix: ${{ github.workflow }}-typecheck-${{ matrix.os }}

      - name: Install
        run: uv sync --locked

      - name: mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # GitHub's macOS runners are Apple Silicon. The oldest and newest
          # Python cover the compatibility range; running all five on both
          # would double the matrix to catch nothing extra.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-test-${{ matrix.os }}

      - name: Install
        run: uv sync --locked

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Integration tests
        run: uv run pytest -m integration

  build:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel on every supported Python
        run: |
          expected=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for python in 3.10 3.11 3.12 3.13 3.14; do
            got=$(uv run --isolated --no-project --python "$python" --with dist/treehawk-*.whl treehawk --version)
            echo "Python $python: $got"
            [ "$got" = "treehawk $expected" ] || { echo "::error::expected 'treehawk $expected', got '$got'"; exit 1; }
          done
