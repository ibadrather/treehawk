name: Release

# Publishes a GitHub release whenever main carries a version that has not been
# released yet: runs the full CI matrix, builds the sdist and the universal
# wheel, and attaches both plus install.sh to a release tagged v<version>.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: CI
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: [plan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Check the file names carry the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -l dist
          test -f "dist/treehawk-$VERSION-py3-none-any.whl"
          test -f "dist/treehawk-$VERSION.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          flags=""
          if printf '%s' "$VERSION" | grep -Eq '(a|b|rc|dev)[0-9]+'; then
            flags="--prerelease"
          fi
          gh release create "v$VERSION" dist/* install.sh \
            --target "$GITHUB_SHA" \
            --title "treehawk $VERSION" \
            --generate-notes \
            $flags
