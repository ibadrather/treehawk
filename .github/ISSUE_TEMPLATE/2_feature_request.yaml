name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Summary
      description: |
        A clear and concise description of what new feature or behavior you would like to see. If applicable, please describe the current behavior as well. If the feature is already on the roadmap (see the README), mention the milestone.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Example
      description: Provide an example of how the user experience would change or how the new feature would be used.
    validations:
      required: false
