name: Bug report
description: Something misbehaved — a crash, wrong data, a missed process, unexpected overhead
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
      placeholder: |
        treehawk run --interval 10ms -- python3 camera_node.py
        Expected the disowned helper process to be recorded; it is missing from the report.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: >
        Output of `uname -srm`, your distro (e.g., Ubuntu 26.04, Raspberry Pi OS
        Bookworm, JetPack 5.x), and how you installed treehawk (installer script,
        cargo install, source build).
      placeholder: |
        Linux 6.8.0-41-generic x86_64
        Ubuntu 26.04, installed via treehawk-installer.sh
    validations:
      required: true
  - type: textarea
    id: tracking-mode
    attributes:
      label: Tracking mode and session manifest
      description: >
        Which tracking mode was active (`tracking_mode` in the session's
        `session.json` — cgroup or pid-tree), and the manifest contents if the
        issue concerns recorded data. Paste `session.json` here if you can.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Output with --verbose
      description: Re-run with `treehawk -vv run ...` and paste the stderr output.
      render: text
    validations:
      required: false
