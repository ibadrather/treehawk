# Automated dependency updates. Cargo updates are grouped so routine bumps
# arrive as one reviewable PR per week; security advisories always open
# immediately regardless of schedule. See CONTRIBUTING.md for the lockfile
# policy (per-dependency updates, never a wholesale `cargo update`).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
