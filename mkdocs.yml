site_name: treehawk
site_description: >-
  Track CPU and RAM usage of a process and every process it spawns, even
  detached daemons. A free command-line resource usage monitor for Linux and
  macOS, with a live dashboard, logs and PDF reports.
site_author: Ibad Rather
site_url: https://ibadrather.github.io/treehawk/
repo_url: https://github.com/ibadrather/treehawk
repo_name: ibadrather/treehawk
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  font: false # brand fonts are loaded by stylesheets/extra.css
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: treehawk-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: treehawk-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  author: Ibad Rather
  # Paste the codes from Google Search Console / Bing Webmaster Tools here.
  google_site_verification: K8_7iHjin1A9LcVpbkK5sqhOQFvW0_bpn_d--RiO7u0
  bing_site_verification: ""
  social_image: assets/output/pdf-page-1.png
  social_image_alt: A treehawk PDF report of CPU and memory usage over time
  keywords:
    - track cpu usage
    - track ram usage
    - track memory usage
    - track resource usage
    - monitor process cpu and memory
    - log cpu usage over time
    - monitor child processes
    - process memory monitor linux
    - monitor cpu usage macos
    - find memory leaks
    - peak memory usage
    - python process monitor

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

exclude_docs: |
  /scripts/

nav:
  - Introduction: index.md
  - Install: install.md
  - Use:
      - Track a workload: workload.md
      - Track the whole machine: machine.md
      - Read the results: results.md
  - Understand:
      - How it works: how-it-works.md
      - Platforms: platforms.md
  - Development: development.md
