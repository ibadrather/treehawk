[project]
name = "prowatch"
version = "0.1.0"
description = "Log CPU and RAM usage of a process and every process it spawns, detached or not."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
prowatch = "prowatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prowatch"]

[tool.mypy]
strict = true
files = ["src/prowatch"]
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pypdf>=6.18.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: spawns real processes; slower than the unit tests",
]
