[project]
name = "treehawk"
version = "0.8.1"
description = "Track CPU and RAM usage of a process and every process it spawns, detached or not. A resource usage monitor for Linux and macOS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ibad Rather", email = "ibad.rather.ir@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "cpu-usage",
    "memory-usage",
    "ram-usage",
    "resource-usage",
    "resource-monitor",
    "process-monitor",
    "system-monitor",
    "cpu-monitor",
    "memory-monitor",
    "memory-leak",
    "monitoring",
    "cpu",
    "memory",
    "ram",
    "process",
    "linux",
    "macos",
    "cgroup",
    "procfs",
    "libproc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.10",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "typing-extensions>=4.12; python_version < '3.13'",
]

[project.urls]
Homepage = "https://ibadrather.github.io/treehawk/"
Documentation = "https://ibadrather.github.io/treehawk/"
Repository = "https://github.com/ibadrather/treehawk"
Issues = "https://github.com/ibadrather/treehawk/issues"
Releases = "https://github.com/ibadrather/treehawk/releases"

[project.scripts]
treehawk = "treehawk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treehawk"]

[tool.hatch.build.targets.sdist]
include = ["src/treehawk", "tests", "packaging", "docs/top.md", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pypdf>=6.18.1",
    "pytest>=8",
    "ruff>=0.16.7",
    "tomli>=2 ; python_full_version < '3.11'",
    "ty==0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: spawns real processes; slower than the unit tests",
]
