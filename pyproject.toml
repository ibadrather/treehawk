[project]
name = "treehawk"
version = "0.2.0"
description = "Log CPU and RAM usage of a process and every process it spawns, detached or not."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ibad Rather", email = "ibad.rather.ir@gmail.com" }]
requires-python = ">=3.12"
keywords = ["monitoring", "cpu", "memory", "process", "cgroup", "procfs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.11.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/ibadrather/treehawk"
Repository = "https://github.com/ibadrather/treehawk"
Issues = "https://github.com/ibadrather/treehawk/issues"
Releases = "https://github.com/ibadrather/treehawk/releases"

[project.scripts]
treehawk = "treehawk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treehawk"]

[tool.hatch.build.targets.sdist]
include = ["src/treehawk", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
strict = true
files = ["src/treehawk"]
python_version = "3.12"
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pypdf>=6.18.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: spawns real processes; slower than the unit tests",
]
