[project]
name = "treehawk"
version = "0.5.0"
description = "Log CPU and RAM usage of a process and every process it spawns, detached or not."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ibad Rather", email = "ibad.rather.ir@gmail.com" }]
requires-python = ">=3.10"
keywords = ["monitoring", "cpu", "memory", "process", "cgroup", "procfs", "macos", "libproc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.10",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "typing-extensions>=4.12; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/ibadrather/treehawk"
Repository = "https://github.com/ibadrather/treehawk"
Issues = "https://github.com/ibadrather/treehawk/issues"
Releases = "https://github.com/ibadrather/treehawk/releases"

[project.scripts]
treehawk = "treehawk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treehawk"]

[tool.hatch.build.targets.sdist]
include = ["src/treehawk", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
# Maximum strictness short of disallow_any_expr. Never loosen these settings,
# and never silence an error with a bare ignore: fix the code instead.
files = ["src", "tests", ".github/scripts"]
mypy_path = ["src", "tests"]
strict = true
warn_unreachable = true
strict_equality_for_none = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pypdf>=6.18.1",
    "pytest>=8",
    "ruff>=0.16.7",
    "tomli>=2 ; python_full_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: spawns real processes; slower than the unit tests",
]
